name: Publicar site com status
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar testes (se falhar, o site não é atualizado)
        run: |
          pip install -r app/requirements.txt
          cd app && python -m pytest -q
      - name: Gerar página de status
        run: |
          cat > site/status.html <<EOF
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8">
          <title>Status</title></head>
          <body>
          <h1>Status da aplicação</h1>
          <ul>
          <li>Commit: ${GITHUB_SHA::7}</li>
          <li>Publicado em: $(date -u '+%d/%m/%Y %H:%M UTC')</li>
          <li>Testes: aprovados</li>
          </ul>
          </body></html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Aguardar o arquivo do site ficar disponível
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -X GET --jq '.total_count') || count=0
            if [[ "$count" == "1" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Arquivo do site não encontrado: $ARTIFACT_NAME"
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
